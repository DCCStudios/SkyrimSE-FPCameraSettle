; FP Camera Settle Configuration
; Adds spring interpolation camera settle effects to first-person camera after player actions

[General]
; Master toggle for all camera settle effects
bEnabled=true
; Global intensity multiplier (1.0 = normal)
fGlobalIntensity=1.0
; Input smoothing (0 = none, 1 = maximum)
fSmoothingFactor=0.3
; Disable camera effects when game is paused (menus, console, etc.)
; When enabled, resets springs and stops applying offsets during menus
bResetOnPause=false
; Number of physics sub-steps per frame (1-8, higher = more stable but slower)
iSpringSubsteps=4

[WeaponState]
; Enable effects when weapon is drawn
bWeaponDrawnEnabled=true
; Enable effects when weapon is sheathed
bWeaponSheathedEnabled=true
; Effect multiplier when weapon is drawn
fWeaponDrawnMult=1.0
; Effect multiplier when weapon is sheathed
fWeaponSheathedMult=0.7

[Settling]
; Delay before settling starts (seconds)
fSettleDelay=0.1
; How fast settling occurs
fSettleSpeed=3.0
; Max damping multiplier when settled
fSettleDampingMult=2.0

[IdleNoise_Drawn]
; Enable subtle camera motion when standing idle (weapon drawn)
bEnabled=false
; Position amplitude X (left/right)
fPosAmpX=0.0
; Position amplitude Y (forward/back)
fPosAmpY=0.0
; Position amplitude Z (up/down breathing)
fPosAmpZ=0.02
; Rotation amplitude pitch (degrees)
fRotAmpX=0.1
; Rotation amplitude roll (degrees)
fRotAmpY=0.0
; Rotation amplitude yaw (degrees)
fRotAmpZ=0.05
; Noise frequency (cycles per second)
fFrequency=0.3

[IdleNoise_Sheathed]
; Enable subtle camera motion when standing idle (weapon sheathed)
bEnabled=true
; Position amplitude X (left/right)
fPosAmpX=0.0
; Position amplitude Y (forward/back)
fPosAmpY=0.0
; Position amplitude Z (up/down breathing)
fPosAmpZ=0.03
; Rotation amplitude pitch (degrees)
fRotAmpX=0.15
; Rotation amplitude roll (degrees)
fRotAmpY=0.0
; Rotation amplitude yaw (degrees)
fRotAmpZ=0.08
; Noise frequency (cycles per second)
fFrequency=0.25

[IdleNoise]
; Blend in/out time in seconds
fBlendTime=0.25
; Disable idle camera noise in dialogue and map menus (blends out smoothly)
bDialogueDisableIdleNoise=false
; Scale idle noise down while drawing bow/crossbow
bScaleDuringArchery=true
; Scale amount while drawing (0-1, e.g., 0.1 = 10%)
fArcheryScaleAmount=0.1
; Scale amount based on Archery skill (100 = 0)
bArcheryScaleBySkill=false

[SprintEffects]
; Enable FOV increase when sprinting
bFovEnabled=true
; FOV increase when sprinting (degrees)
fFovDelta=10.0
; How fast to blend FOV (higher = faster)
fFovBlendSpeed=3.0
; Enable radial blur when sprinting
bBlurEnabled=false
; Radial blur strength (0-1)
fBlurStrength=0.3
; How fast to blend blur (higher = faster)
fBlurBlendSpeed=3.0
; IMOD ramp up time in seconds (how fast blur appears)
fBlurRampUp=0.1
; IMOD ramp down time in seconds (how fast blur fades)
fBlurRampDown=0.2
; Blur start radius (0 = blur from center, 1 = edges only)
fBlurRadius=0.5

[FOVPunch]
; Enable FOV punch when taking a hit
bHitEnabled=true
; Enable FOV punch on arrow/bolt release
bArrowEnabled=true
; Hit punch strength as percent of current FOV (e.g., 5.0 = +/-5%)
fHitStrength=5.0
; Arrow punch strength as percent of current FOV (e.g., 3.0 = +/-3%)
fArrowStrength=3.0
; Total punch duration in seconds
fDuration=0.25

; ============================================
; FALL EFFECT (Mirror's Edge style disorientation)
; ============================================
; Audio is OPTIONAL - place loose WAV files at:
;   Data/SKSE/Plugins/FPCameraSettle/fallingwindloop.wav
;   Data/SKSE/Plugins/FPCameraSettle/fallingwhineloop.wav
; If files are missing, audio simply does nothing (no errors).
; ============================================

[FallEffect]
; Master toggle for the entire fall disorientation effect (opt-in, off by default)
bEnabled=false
; Time in seconds in the air before the effect can begin
fTriggerTime=0.75
; Downward velocity threshold (units/sec) to trigger
fTriggerVelocity=800.0
; If true, BOTH air time AND velocity must be exceeded; otherwise EITHER is enough
bRequireBothConditions=false
; Phase 1 -> Phase 2 transition time (seconds since fall start)
fPhase1Duration=1.0
; Phase 2 length (Phase 3 begins at fPhase1Duration + fPhase2Duration)
fPhase2Duration=2.0

[FallEffect_Shake]
bEnabled=true
fIntensity=1.0
; Time from fall start to full shake intensity (seconds)
fFadeIn=1.0
fPosScale=1.0
fRotScale=1.0
fFrequency=8.0
; 0 = pure sine, 1 = pure noise
fNoiseAmount=0.5
bAffectPosition=true
bAffectRoll=true
bAffectPitch=true
bAffectYaw=true
fDownwardBias=0.4
bScaleByVelocity=true

[FallEffect_Audio]
; Volumes are 0..5 (0..500%). Volume is applied per-sample in software.
; Place WAV files in:
;   Data/SKSE/Plugins/FPCameraSettle/fallingwindloop.wav
;   Data/SKSE/Plugins/FPCameraSettle/fallingwhineloop.wav
bEnabled=true
bWindEnabled=true
bWhineEnabled=true
fMasterVolume=1.0
fWindMaxVolume=1.0
fWhineMaxVolume=0.6
fWindFadeIn=0.5
fWhineFadeIn=1.0
fFadeOut=0.6
bVolumeByVelocity=true
; Fade curve: 0=Linear, 1=Smooth(S-curve), 2=EaseIn, 3=EaseOut, 4=Exponential
iFadeCurve=0

[FallEffect_Visual]
bDoubleVisionEnabled=true
fDoubleVisionMaxStrength=1.0
; Time from Phase 2 start to full double-vision (seconds)
fDoubleVisionFadeIn=1.0
bMotionBlurEnabled=true
fMotionBlurMaxStrength=0.6
; Time from Phase 3 start to full blur (seconds)
fMotionBlurFadeIn=0.5

[FallEffect_FOV]
bEnabled=true
fOscAmplitude=3.0
fOscFrequency=1.5

[FallEffect_Fatal]
; Mirror's Edge-style fatal landing (cut to black on death by fall)
bEnabled=true
; How long the black screen is held (seconds)
fBlackDuration=2.0
; How fast the screen goes black on impact (seconds, very fast = sudden)
fFadeInTime=0.05
; How fast the screen fades back from black (seconds)
fFadeOutTime=0.8
; Whine volume spike on impact (multiplier of configured max; 2.0 = double)
fWhineBoost=2.0
; How long the spiked whine takes to decay (seconds)
fWhineDecay=1.0
; Impact body-slam sound volume (0-5; >1.0 amplifies)
; Place WAV at: Data/SKSE/Plugins/FPCameraSettle/fallingdeathimpact.wav
fImpactVolume=1.0

[Debug]
; Enable detailed debug logging
bDebugLogging=false
; Show debug info on screen
bDebugOnScreen=false
; Auto-reload INI when changed
bEnableHotReload=true
; Hot reload check interval (seconds)
fHotReloadInterval=5.0

